<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jewel Fashion - Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f2ed;
      color: #222;
    }
    header {
      background: #171717;
      color: #d6b46a;
      padding: 22px 16px;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 24px auto;
      padding: 16px;
    }
    .panel {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px #0000000d;
    }
    h2 { margin-top: 0; }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 7px;
    }
    input, textarea {
      border: 1px solid #ccc;
    }
    button {
      border: 0;
      background: #171717;
      color: #d6b46a;
      font-weight: bold;
      margin-top: 16px;
    }
    .notice {
      background: #fff3cd;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>JEWEL FASHION</h1>
    <p>Admin Dashboard</p>
  </header>  <main>
    <section class="panel">
      <h2>Administrator Login</h2>
      <p class="notice">
        Secure login will be connected through Supabase
        before this dashboard is used to manage real products.
      </p>
      <label for="email">Admin email</label>
      <input id="email" type="email" placeholder="Enter admin email">
      <label for="password">Password</label>
      <input id="password" type="password"
             placeholder="Enter password">
      <button type="button" onclick="adminLogin()">
  Sign In
      </button>
    </section>
    <section class="panel">
  <h2>Add a Fashion Product</h2>
  <label for="product">Product name</label>
  <input id="product" placeholder="e.g. Elegant gown">

  <label for="price">Price (₦)</label>
  <input id="price" type="number" min="0"
         placeholder="Enter price">

  <label for="photo">Product photo</label>
  <input id="photo" type="file" accept="image/*">

  <label for="description">Description</label>
  <textarea id="description" rows="4"
            placeholder="Describe the outfit"></textarea>

  <button type="button" onclick="adminLogin()">
  Login
</button>
    </section>

<section class="panel">
  <h2>Manage Orders</h2>
  <p>Customer orders will appear here after the database is connected.</p>
</section>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

<script>
  
async function adminLogin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please enter your email and password.");
    return;
  }

  const { data, error } = await window.supabaseClient.auth
    .signInWithPassword({ email, password });

  if (error) {
    alert("Login failed: " + error.message);
    return;
  }

  alert("Login successful!");
}
  
</script>

</body>
</html>
